<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshChat Pro | النظام اللامركزي الآمن A+</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b141a;
            color: #e9edef;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 1000px;
            height: 100vh;
            background: #111b21;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        @media (min-width: 768px) {
            .app-container {
                height: 92vh;
                border-radius: 12px;
                overflow: hidden;
            }
        }
        /* الهيدر العلوي */
        .app-header {
            background: #202c33;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222d34;
        }
        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00a884 0%, #005c4b 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            font-size: 1.1rem;
        }
        .info h3 {
            font-size: 1rem;
            color: #f1f1f2;
        }
        .info span {
            font-size: 0.75rem;
            color: #00a884;
        }
        .security-shield {
            background: rgba(0, 168, 132, 0.15);
            color: #00a884;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(0, 168, 132, 0.3);
        }
        /* منطقة الرسائل */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #0b141a;
            background-image: radial-gradient(circle, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .message-bubble.incoming {
            background: #202c33;
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        .message-bubble.outgoing {
            background: #005c4b;
            align-self: flex-end;
            border-top-right-radius: 0;
        }
        .message-bubble .time {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.6);
            float: left;
            margin-top: 6px;
            margin-left: 8px;
        }
        /* شريط التحكم السفلي */
        .chat-footer {
            background: #202c33;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #222d34;
        }
        .chat-footer input[type="text"] {
            flex: 1;
            background: #2a3942;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .tool-btn {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 6px;
            transition: color 0.3s;
        }
        .tool-btn:hover {
            color: #00a884;
        }
        .send-action-btn {
            background: #00a884;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .send-action-btn:hover {
            background: #01755f;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر -->
        <div class="app-header">
            <div class="profile-section">
                <div class="avatar">M</div>
                <div class="info">
                    <h3>MeshChat Pro (Ultra)</h3>
                    <span>متصل • تشفير تـام A+</span>
                </div>
            </div>
            <div class="security-shield">🔒 أمان لامركزي</div>
        </div>

        <!-- صندوق المحادثة -->
        <div class="chat-body" id="chatBody">
            <div class="message-bubble incoming">
                مرحباً بك في الشبكة اللامركزية المتقدمة! النظام يعمل بأعلى معايير الأمان السيبراني. يمكنك كتابة الرسائل أو رفع الوسائط الآن.
                <span class="time">09:30 ص</span>
            </div>
        </div>

        <!-- شريط الإدخال والوسائط -->
        <div class="chat-footer">
            <label class="tool-btn" title="إرفاق صورة أو فيديو">
                📎 <input type="file" id="mediaFile" style="display: none;" accept="image/*,video/*">
            </label>
            <button class="tool-btn" id="voiceRecordBtn" title="تسجيل صوتي">🎤</button>
            <input type="text" id="userInput" placeholder="اكتب رسالة مشفرة..." autofocus>
            <button class="send-action-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const chatBody = document.getElementById('chatBody');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const mediaFile = document.getElementById('mediaFile');
        const voiceRecordBtn = document.getElementById('voiceRecordBtn');

        function addMessage(text, senderType = 'outgoing') {
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${senderType}`;
            
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            bubble.innerHTML = `${text} <span class="time">${timeStr}</span>`;
            
            chatBody.appendChild(bubble);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (text !== '') {
                addMessage(text, 'outgoing');
                userInput.value = '';
                
                // محاكاة استجابة الشبكة الذكية
                setTimeout(() => {
                    addMessage('تم معالجة وتشفير رسالتك بنجاح عبر عقد MeshChat الأمنية ⚡', 'incoming');
                }, 1000);
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        mediaFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                addMessage(`📁 تم إرسال ملف الوسائط بنجاح: ${file.name}`, 'outgoing');
            }
        });

        voiceRecordBtn.addEventListener('click', () => {
            addMessage('🎤 [تسجيل صوتي مشفر - مدة الفويس: 0:05 ثانية]', 'outgoing');
        });
    </script>

</body>
</html>
