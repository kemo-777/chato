<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshChat Pro | النظام الآمن للاتصالات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b141a;
            color: #e9edef;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            background: #111b21;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        @media (min-width: 768px) {
            .chat-container {
                height: 90vh;
                border-radius: 12px;
                overflow: hidden;
            }
        }
        /* الهيدر */
        .chat-header {
            background: #202c33;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222d34;
        }
        .user-info h2 {
            font-size: 1.1rem;
            color: #f1f1f2;
        }
        .user-info span {
            font-size: 0.8rem;
            color: #00a884;
        }
        .security-badge {
            background: rgba(0, 168, 132, 0.15);
            color: #00a884;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        /* منطقة الرسائل */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #0b141a;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            position: relative;
            word-wrap: break-word;
        }
        .message.incoming {
            background: #202c33;
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        .message.outgoing {
            background: #005c4b;
            align-self: flex-end;
            border-top-right-radius: 0;
        }
        .message .time {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            float: left;
            margin-top: 5px;
            margin-right: 10px;
        }
        /* شريط الإدخال */
        .chat-input-area {
            background: #202c33;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background: #2a3942;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .action-btn {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            transition: color 0.3s;
        }
        .action-btn:hover {
            color: #00a884;
        }
        .send-btn {
            background: #00a884;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s;
        }
        .send-btn:hover {
            background: #01755f;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- الهيدر -->
        <div class="chat-header">
            <div class="user-info">
                <h2>MeshChat Pro 🌐</h2>
                <span>متصل بالشبكة اللامركزية</span>
            </div>
            <div class="security-badge">🔒 أمان تام A+</div>
        </div>

        <!-- صندوق الرسائل -->
        <div class="chat-messages" id="messageBox">
            <div class="message incoming">
                أهلاً بك! تم تأمين الاتصال بنجاح. ابدأ بإرسال رسالتك الأولى الآن.
                <span class="time">09:30 ص</span>
            </div>
        </div>

        <!-- شريط الإدخال والوسائط -->
        <div class="chat-input-area">
            <label class="action-btn" title="إرسال صورة أو فيديو">
                📎 <input type="file" id="mediaInput" style="display: none;" accept="image/*,video/*">
            </label>
            <button class="action-btn" id="voiceBtn" title="تسجيل صوتي">🎤</button>
            <input type="text" id="messageInput" placeholder="اكتب رسالة مشفرة..." autofocus>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const messageBox = document.getElementById('messageBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const mediaInput = document.getElementById('mediaInput');
        const voiceBtn = document.getElementById('voiceBtn');

        function appendMessage(text, type = 'outgoing') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            msgDiv.innerHTML = `${text} <span class="time">${timeString}</span>`;
            messageBox.appendChild(msgDiv);
            messageBox.scrollTop = messageBox.scrollHeight;
        }

        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (text !== '') {
                appendMessage(text, 'outgoing');
                messageInput.value = '';
                
                // محاكاة استجابة من السيرفر اللامركزي
                setTimeout(() => {
                    appendMessage('تم استلام رسالتك وتشفيرها بنجاح عبر الشبكة اللامركزية 🚀', 'incoming');
                }, 1000);
            }
        });

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        // محاكاة إرسال الصور والفيديوهات
        mediaInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                appendMessage(`📁 تم إرسال ملف الوسائط: ${file.name}`, 'outgoing');
            }
        });

        // محاكاة تسجيل الفويسات
        voiceBtn.addEventListener('click', () => {
            appendMessage('🎤 [رسالة صوتية مشفرة - 0:04 ثوانٍ]', 'outgoing');
        });
    </script>

</body>
</html>
